# Dead Space 2 for PS5 - settings.
#
# Copy this file to ds2.toml (next to it, in the app's folder) and remove the
# "#" in front of a line to change that setting. Without a ds2.toml the app
# uses the values shown here. A line the app doesn't understand is ignored.

# The game's language: "auto" follows the PS5's. The World (En,Fr,Es) discs
# have English and French voices, and Spanish text with English voices.
#ps5_language = "auto"          # auto, english, french, spanish

# Frames a second the game aims for: 60, or 30, the game as it shipped on the
# Xbox 360. Set 30 if something looks or plays wrong at 60.
#ps5_frame_rate = 60

# At 60, some cutscene animation isn't quite right (as in the PC release), so
# the game goes back to its own 30 while a cutscene has hold of Isaac, and to
# 60 when it is over. false: 60 in cutscenes too.
#ps5_cutscenes_30 = true

# Adaptive vsync: a frame that is a little late is shown as soon as it is
# ready. false is the Xbox 360's way: it waits for the next refresh, so a
# frame that takes 17 ms is shown after 33 and 60 frames a second become 30.
# Set false if the game's speed or its motion seems wrong.
#vsync_adaptive = true

# Faster tracking of the graphics data the game rewrites every frame (moving
# characters, effects). New and untested: set false if geometry flickers,
# stretches or is left behind where it was a moment ago.
#shared_memory_volatile_pages = true

# A frames-a-second counter in the top right corner of the picture.
#ps5_show_fps = false

# The TV mode the picture is sent in: 2160 (4K), 1440 or 1080. The picture
# the game draws (resolution_scale, below) is scaled to it.
#ps5_display_height = 2160

# The resolution the game is drawn at, in times the Xbox 360's 1280x720:
# 1 = 1280x720, 2 = 2560x1440, 3 = 3840x2160 (native 4K). Each step is a lot
# more work for the graphics chip (2 is four times the pixels of 1, 3 is nine
# times). If the frame rate dips, the log's "gpu busy" says whether this is
# why: near 100%, the graphics chip is the limit.
#resolution_scale = 1

# Sound queued ahead of the speakers, in 5.3 ms frames (4 to 64). Fewer is
# less delay between picture and sound, but may crackle.
#audio_maxqframes = 8

# The progress screen of the first start, while the game's files are prepared
# (unpacking Severed takes a few minutes). false: no screen, only a PS5
# notification; try it if the app stays black and never reaches the game.
#ps5_prepare_screen = true

# The log (in the app's logs folder): info, debug or trace say more.
#log_level = "info"

# Experiment, for performance work: the copies the emulator makes when the
# game switches the Xbox 360's EDRAM from one surface to another ("EDRAM
# transfers" in the profile). "all" makes every one, as it should; "none"
# skips them all, which is faster and will show wrong pictures where the game
# needs a copy; "color" or "depth" makes only those of that kind.
#ps5_edram_transfers = "all"

# Most of those copies came from the lighting's stencil culling, which the
# game draws at 4x MSAA over the memory of the 1x picture (a quarter of the
# work on an Xbox 360, two full-screen copies here, 20 to 50 times a frame).
# "full" draws it at 1x instead, with no copies: at native 4K the worst room
# measured went from 21 to 33 frames a second. "game" is the Xbox 360's way;
# set it if lights look wrong (missing, cut off, or lighting things they
# shouldn't), and say where.
#ps5_lowres_culling = "full"

# The Xbox 360's Direct3D clears most of a surface the same way (as 4x MSAA
# at half the size), a copy each way here. "full" clears all of it as the
# surface is: in the worst room measured, another 3.5 ms a frame saved at 4K.
# "game" is the Xbox 360's way; set it if the picture shows leftovers of an
# earlier frame or flashes, and say where.
#ps5_lowres_clears = "full"

# For the native renderer's work: 1 records the game's Direct3D calls. Every
# 30 s a line in the log, every 60 s one whole frame call by call in the logs
# folder (d3d_frame_<n>.txt), and each shader the game creates
# (d3d_shaders.txt). A little slower while a frame is recorded.
#ps5_d3d_trace = 0

# For tests: the game's picture every this many seconds in the logs folder
# (capture_<n>.bmp, at most 1280 wide), to send with a log. 0: never.
#ps5_capture = 0

# For tests: buttons pressed by themselves at those seconds, e.g. through the
# menus into the last save: "6:start 10:start 14:start 18:start 22:start
# 26:start 30:start 34:start 38:start 42:a 50:a". Leave it empty to play.
#ps5_input_script = ""

# Experiment, at resolution_scale 2 or 3: native resolves. 1: the pictures the
# game copies out of its render targets reach the textures that read them
# directly, instead of through the Xbox 360's memory layout and back. 2: and
# once only those textures read them, they aren't written to memory at all
# (the log says so, and if anything else reads one later, it is written
# again). 0: as the Xbox 360 does it. Say if a picture flickers, shows an
# old frame or looks wrong somewhere with it on.
#ps5_resolve_forward = 0

# Experiment: the emulator takes the game's full-screen drawing to reach far
# below the picture, and then copies the depth buffer and the picture over
# each other every time (the "EDRAM transfers" left). true bounds it by the
# viewport the game set. Say if the bottom of the picture shows something old
# or wrong with it on.
#ps5_draw_extent_from_viewport = false

# For performance work only, when a log is being recorded to find out what
# limits the frame rate: every 30 s the log gets, for each busy thread, how
# much of a processor core it used and where it spent the time. To find that
# out it stops every thread 100 times a second to see what it is doing, and
# that slows the game a little (a few percent). Leave it off to play.
#ps5_profile = false

# Every 10 s, a line in the log with the frame rate, how busy the graphics
# chip was, and other progress counters; and where every thread is when the
# game stops drawing. Costs next to nothing; leave on while the port is young.
#ps5_diag_monitor = true
